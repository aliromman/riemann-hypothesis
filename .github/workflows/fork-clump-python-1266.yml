name: Run clump and native Python suites with the repository SDK pins
on:
  push:
    branches: [ci/clump-scopes/ubuntu-python-1266]
    paths: [.github/workflows/fork-clump-python-1266.yml, ci/clump-diagnostics/control.py]
permissions:
  contents: read
jobs:
  python-suites:
    if: github.repository == 'aliromman/riemann-hypothesis'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: aliromman/riemann-hypothesis
          ref: 963ebea3bb3d7c2c5738946fca45317b8084f972
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Bind the Python suites to the author source and its compiler
        id: setup
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = 963ebea3bb3d7c2c5738946fca45317b8084f972
          test "$(git rev-parse HEAD:src)" = bd038d97d3d9f38ac0ea2eba4e4d7a8ec4cc3749
          python -m venv "$RUNNER_TEMP/unit-env"
          "$RUNNER_TEMP/unit-env/bin/python" -m pip install --disable-pip-version-check -r scripts/ci-publisher-requirements.txt PyYAML==6.0.2
          "$RUNNER_TEMP/unit-env/bin/python" -m pip check
          curl -fsSL --retry 3 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh"
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none
          "$HOME/.elan/bin/elan" toolchain install "$(cat lean-toolchain)"
          mkdir "$RUNNER_TEMP/unit-tests"
          export PATH="$RUNNER_TEMP/unit-env/bin:$HOME/.elan/bin:$PATH"
          echo "$RUNNER_TEMP/unit-env/bin" >> "$GITHUB_PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          { git rev-parse HEAD HEAD:src; python3 --version; python3 -c 'import yaml; print("PyYAML", yaml.__version__)'; python3 -c 'import boto3, botocore; print("boto3", boto3.__version__, "botocore", botocore.__version__)'; cp --version; lean --version; lake --version; } | tee "$RUNNER_TEMP/unit-tests/source-and-versions.txt"
      - name: Run native CI unit tests
        shell: bash
        run: python3 -m unittest discover -s tools/ci_native 2>&1 | tee "$RUNNER_TEMP/unit-tests/native.txt"
      - name: Run focused clump tests
        if: always() && steps.setup.outcome == 'success'
        shell: bash
        run: python3 -m unittest discover -s scripts/tests -p test_clump_scopes.py 2>&1 | tee "$RUNNER_TEMP/unit-tests/clump.txt"
      - name: Run all repository script unit tests
        if: always() && steps.setup.outcome == 'success'
        shell: bash
        run: python3 -m unittest discover -s scripts/tests 2>&1 | tee "$RUNNER_TEMP/unit-tests/scripts.txt"
      - name: Check out the fork-only stock diagnostic harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: fork-verifier
          persist-credentials: false
          sparse-checkout: ci/clump-diagnostics
      - name: Attribute four real stock Lake diagnostics on the submitted source
        shell: bash
        run: |
          git fetch --quiet --depth=1 --no-tags --filter=blob:none origin 2b481024a8665bd5b24ca40d28fe90cb4fb86ce0 989ea9c41e8400a6fe894fe365298c219f8c7e1d
          python3 fork-verifier/ci/clump-diagnostics/control.py "$PWD" "$RUNNER_TEMP/unit-tests"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ubuntu-suites-963ebea3bb3d7c2c5738946fca45317b8084f972
          path: ${{ runner.temp }}/unit-tests/
          if-no-files-found: error
          retention-days: 7

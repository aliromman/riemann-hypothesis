name: Compare four Lean theorem sources inside Bubblewrap
on:
  push:
    branches: [ci/batch-1119/source-sandbox]
    paths: [ci/source-sandbox/plan.json]
permissions:
  contents: read
jobs:
  python-suites:
    if: github.repository == 'aliromman/riemann-hypothesis'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: aliromman/riemann-hypothesis
          ref: 2b481024a8665bd5b24ca40d28fe90cb4fb86ce0
          persist-credentials: false
      - name: Bind the Python suites to the author source and its compiler
        id: setup
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = 2b481024a8665bd5b24ca40d28fe90cb4fb86ce0
          test "$(git rev-parse HEAD:src)" = a598d19cccf798deb6e2bea9700cbac2ff050e11
          if ! /usr/bin/python3 -c 'import yaml'; then
            sudo apt-get update -qq
            sudo apt-get -qy --no-install-recommends install python3-yaml
          fi
          curl -fsSL --retry 3 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh"
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none
          "$HOME/.elan/bin/elan" toolchain install "$(cat lean-toolchain)"
          mkdir "$RUNNER_TEMP/unit-tests"
          export PATH="$HOME/.elan/bin:/usr/bin:$PATH"
          echo /usr/bin >> "$GITHUB_PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          { git rev-parse HEAD HEAD:src; python3 --version; python3 -c 'import yaml; print("PyYAML", yaml.__version__)'; cp --version; lean --version; lake --version; } | tee "$RUNNER_TEMP/unit-tests/source-and-versions.txt"
      - name: Run native CI unit tests
        shell: bash
        run: python3 -m unittest discover -s tools/ci_native 2>&1 | tee "$RUNNER_TEMP/unit-tests/native.txt"
      - name: Run focused clump tests
        if: always() && steps.setup.outcome == 'success'
        shell: bash
        run: python3 -m unittest discover -s scripts/tests -p test_clump_scopes.py 2>&1 | tee "$RUNNER_TEMP/unit-tests/clump.txt"
      - name: Run all repository script unit tests
        if: always() && steps.setup.outcome == 'success'
        shell: bash
        run: python3 -m unittest discover -s scripts/tests 2>&1 | tee "$RUNNER_TEMP/unit-tests/scripts.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ubuntu-suites-2b481024
          path: ${{ runner.temp }}/unit-tests/
          if-no-files-found: error
          retention-days: 7
  check:
    if: github.repository == 'aliromman/riemann-hypothesis'
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: ci/source-sandbox
      - name: Probe ordinary unprivileged Bubblewrap
        run: |
          mkdir -p "$RUNNER_TEMP/proof-logs"
          if ! command -v bwrap; then
            sudo apt-get -qq update
            sudo apt-get -qy --no-install-recommends install bubblewrap
          fi
          python3 ci/source-sandbox/check.py probe
      - name: Bind the parent and actual GitHub PR merge sources
        run: python3 ci/source-sandbox/check.py sources
      - name: Install the pinned Lean toolchain
        run: |
          curl -fsSL --retry 3 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh"
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none
          "$HOME/.elan/bin/elan" toolchain install "$(cat "$RUNNER_TEMP/proof-project/lean-toolchain")"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch Mathlib dependencies for the seven project sources
        run: |
          cd "$RUNNER_TEMP/proof-project"
          mapfile -t imports < "$RUNNER_TEMP/proof-logs/mathlib.txt"
          export MATHLIB_CACHE_DIR="$RUNNER_TEMP/mathlib-cache"
          lake exe mathlib/cache get "${imports[@]}"
      - name: Run stock Comparator with source and default sandbox
        run: |
          ci="$PWD/ci/source-sandbox/check.py"
          cd "$RUNNER_TEMP/proof-project"
          lean="$(elan which lean)"
          export PATH="${lean%/*}:$PATH"
          export LEAN_NUM_THREADS=1
          python3 "$ci" compare
      - name: Retain original sandbox reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source-sandbox-${{ github.sha }}
          path: ${{ runner.temp }}/proof-logs
          if-no-files-found: error
          retention-days: 7

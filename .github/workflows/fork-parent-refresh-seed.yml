name: Prepare the published RH parent for both native comparisons
on:
  push:
    branches: [ci/import-pruning/screen]
    paths: ['ci/parent-refresh/authority.json', 'ci/parent-refresh/seed.py']

permissions:
  contents: read

jobs:
  seed:
    if: github.repository == 'aliromman/riemann-hypothesis' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          path: harness
          sparse-checkout: |
            ci/current-recheck
            ci/import-screen
            ci/parent-refresh
      - id: identity
        working-directory: harness
        run: |
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          data=json.loads(Path('ci/parent-refresh/authority.json').read_bytes())
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              print('base='+data['base'],file=out)
              print('key=rh-screen-all-'+data['manifest'],file=out)
          PY
      - id: existing
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          key: ${{ steps.identity.outputs.key }}
          path: ${{ runner.temp }}/rh-screen-cache
          lookup-only: true
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        if: steps.existing.outputs.cache-hit != 'true'
        with:
          repository: leanprover-community/riemann-hypothesis
          ref: ${{ steps.identity.outputs.base }}
          path: parent
          persist-credentials: false
          sparse-checkout: |
            scripts
            src
      - name: Recover the previous official module archive set
        if: steps.existing.outputs.cache-hit != 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          key: rh-screen-all-edc38df9198228480080821adb772f6c4109fdba7404a04be28bc49a250cb487
          path: ${{ runner.temp }}/rh-screen-cache
      - name: Verify the published manifest and download only missing official archives
        if: steps.existing.outputs.cache-hit != 'true'
        run: |
          python3 harness/ci/parent-refresh/seed.py --parent parent --cache "$RUNNER_TEMP/rh-screen-cache" --authority harness/ci/parent-refresh/authority.json
          df -h .
      - name: Save the fully authenticated project archives for both proposals
        if: steps.existing.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          key: ${{ steps.identity.outputs.key }}
          path: ${{ runner.temp }}/rh-screen-cache

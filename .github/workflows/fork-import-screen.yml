name: Screen private imports against the published parent
on:
  push:
    branches: [ci/import-pruning/screen]

permissions:
  contents: read

env:
  MATHLIB_CACHE_GET_URL: https://cache.mathlib.org/mathlib4
  LEAN_ABORT_ON_PANIC: '1'
  LEAN_NUM_THREADS: '2'

jobs:
  prepare:
    if: github.repository == 'aliromman/riemann-hypothesis' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 210
    outputs:
      groups: ${{ steps.scope.outputs.groups }}
      cache: ${{ steps.scope.outputs.cache }}
      math: ${{ steps.scope.outputs.math }}
      parallel: ${{ steps.scope.outputs.parallel }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: harness
          persist-credentials: false
          sparse-checkout: ci/import-screen
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: leanprover-community/riemann-hypothesis
          ref: a28ad7ec8b9f5ff4ec448fe210d3ac57aacfffe1
          path: parent
          fetch-depth: 2
          persist-credentials: false
          sparse-checkout: |
            scripts
            src
      - id: scope
        name: Select the reviewed panel and cache keys
        working-directory: harness/ci/import-screen
        env:
          INPUT_HASH: ${{ hashFiles('harness/ci/import-screen/plans/*.txt', 'harness/ci/import-screen/prepare.py', 'harness/ci/import-screen/lake_imports.py', 'harness/ci/import-screen/panels.py', 'harness/ci/import-screen/catalog.json', 'harness/ci/import-screen/reuse-meta.json') }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          from prepare import MANIFEST, groups
          phase = Path('phase').read_text().strip()
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
              print('groups='+json.dumps(groups(phase)),file=output)
              print('parallel='+str(12 if phase in ('latest','latest-tail') else 4),file=output)
              print('cache=rh-screen-v3-'+phase.split('-',1)[0]+'-'+MANIFEST+'-'+os.environ['INPUT_HASH'],file=output)
              print('math=rh-screen-math-v1-linux-x64-31ce06eaadf4a200c0e1407c5f10953cf606b8f8',file=output)
          PY
      - name: Restore the shared authenticated project archives
        id: cached-parent
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/rh-screen-cache
          key: ${{ steps.scope.outputs.cache }}
          restore-keys: |
            rh-screen-v2-rest-db681d77faedbe9dd13afdd6e0a4076e63539302dba3ee98d48f6e072e103855-
            rh-screen-v2-full-db681d77faedbe9dd13afdd6e0a4076e63539302dba3ee98d48f6e072e103855-
            rh-screen-v1-full-db681d77faedbe9dd13afdd6e0a4076e63539302dba3ee98d48f6e072e103855-
            rh-screen-v1-pilot-db681d77faedbe9dd13afdd6e0a4076e63539302dba3ee98d48f6e072e103855-
      - name: Bind the community cache to the pinned source and fetch each missing archive once
        run: |
          trial=harness/ci/import-screen
          python3 "$trial/prepare.py" seed "$(cat "$trial/phase")" --parent parent             --state "$RUNNER_TEMP/rh-screen-cache" --work "$RUNNER_TEMP/rh-seed"
      - name: Save source and cache crossover evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: input-equivalence-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 3
          path: ${{ runner.temp }}/rh-screen-cache/metadata/reuse-check.json
      - name: Save the verified project archive set
        if: steps.cached-parent.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/rh-screen-cache
          key: ${{ steps.scope.outputs.cache }}
      - name: Restore the pinned Mathlib download cache
        id: cached-math
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/rh-mathlib-cache
          key: ${{ steps.scope.outputs.math }}
      - name: Install Lean to fetch the missing Mathlib archives
        if: steps.cached-math.outputs.cache-hit != 'true'
        working-directory: parent
        run: bash ../harness/ci/import-screen/install-lean.sh
      - name: Download pinned Mathlib archives without expanding them
        if: steps.cached-math.outputs.cache-hit != 'true'
        working-directory: parent
        run: MATHLIB_CACHE_DIR="$RUNNER_TEMP/rh-mathlib-cache" lake exe mathlib/cache get-
      - name: Save the compressed Mathlib archives
        if: steps.cached-math.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/rh-mathlib-cache
          key: ${{ steps.scope.outputs.math }}

  screen:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 335
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.prepare.outputs.parallel) }}
      matrix:
        group: ${{ fromJSON(needs.prepare.outputs.groups) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: harness
          persist-credentials: false
          sparse-checkout: ci/import-screen
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: leanprover-community/riemann-hypothesis
          ref: a28ad7ec8b9f5ff4ec448fe210d3ac57aacfffe1
          path: parent
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/
            /lean-toolchain
            /lakefile.toml
            /lake-manifest.json
      - name: Restore the shared authenticated project archives
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/rh-screen-cache
          key: ${{ needs.prepare.outputs.cache }}
          fail-on-cache-miss: true
      - name: Install the pinned compiler
        working-directory: parent
        run: bash ../harness/ci/import-screen/install-lean.sh
      - name: Restore the pinned Mathlib archives
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/rh-mathlib-cache
          key: ${{ needs.prepare.outputs.math }}
          fail-on-cache-miss: true
      - name: Expand the official Mathlib cache
        working-directory: parent
        run: |
          MATHLIB_CACHE_DIR="$RUNNER_TEMP/rh-mathlib-cache" lake exe mathlib/cache get
          git diff --exit-code -- lake-manifest.json lakefile.toml lean-toolchain
          df -h .
      - name: Validate the selected parent archives and keep the required Lean facets
        working-directory: parent
        env:
          GROUP: ${{ matrix.group }}
        run: |
          python3 ../harness/ci/import-screen/prepare.py restore "$GROUP" --parent .             --state "$RUNNER_TEMP/rh-screen-cache" --work "$RUNNER_TEMP/rh-results"             --leantar "$(dirname "$(elan which lean)")/leantar"
      - name: Compile the native comparison helper
        working-directory: parent
        run: |
          trial="$GITHUB_WORKSPACE/harness/ci/import-screen"
          lean -R "$trial" -c "$RUNNER_TEMP/CheckInterface.c" "$trial/CheckInterface.lean"
          leanc -O2 -o "$RUNNER_TEMP/check-interface" "$RUNNER_TEMP/CheckInterface.c"
      - name: Recover authenticated results for this exact group and verification code
        id: checkpoint
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/rh-screen-receipts
          key: rh-receipts-v1-${{ matrix.group }}-${{ hashFiles('harness/ci/import-screen/*.py', 'harness/ci/import-screen/*.lean', 'harness/ci/import-screen/catalog.json', 'harness/ci/import-screen/targets.txt') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            rh-receipts-v1-${{ matrix.group }}-${{ hashFiles('harness/ci/import-screen/*.py', 'harness/ci/import-screen/*.lean', 'harness/ci/import-screen/catalog.json', 'harness/ci/import-screen/targets.txt') }}-
      - name: Check candidate source and compare its compiled output to the parent
        id: screen
        working-directory: parent
        run: |
          python3 -u ../harness/ci/import-screen/screen.py --parent .             --state "$RUNNER_TEMP/rh-screen-cache" --work "$RUNNER_TEMP/rh-results"             --bin "$(dirname "$(elan which lean)")" --judge "$RUNNER_TEMP/check-interface" --resume "$RUNNER_TEMP/rh-screen-receipts"
      - name: Save a resumable source-bound group checkpoint
        if: always() && (steps.screen.outcome == 'success' || steps.screen.outcome == 'failure' || steps.screen.outcome == 'cancelled') && steps.checkpoint.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/rh-screen-receipts
          key: ${{ steps.checkpoint.outputs.cache-primary-key }}
      - name: Save the per-module results, hashes and coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: import-screen-${{ matrix.group }}-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 3
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/rh-results/results.jsonl
            ${{ runner.temp }}/rh-results/scope.json
            ${{ runner.temp }}/rh-results/report.json
